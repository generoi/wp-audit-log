name: Test

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  PHP_VERSION: '8.3'

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - run: composer install --no-interaction

      - run: composer lint

      - run: composer test
